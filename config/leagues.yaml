  - OGN
  - LPL
  - name: LEC
    start_year: 2019
  - EU LCS
  - name: LCS
    start_year: 2019
  - NA LCS
  - LTA N
  - LTA S
  - LTA
  - CBLOL
  - LCP
  - name: LMS
    end_year: 2019
  - name: PCS
    start_year: 2020
    end_year: 2024

international:
  - WLDs
  - MSI
  - FST
  - EWC
  - MSC

international_require_tier1_teams: true

regions:
  KR:
    - LCK
    - OGN
